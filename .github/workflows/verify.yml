name: Verify Wodah
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test && npm run check && npm run lint && npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wodah-browser-verification
          path: artifacts/
